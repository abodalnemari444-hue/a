<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>المنيو - مطعم يا حبايب</title>
  <meta name="theme-color" content="#d9622b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="يا حبايب" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo-emoji">🍽️</span>
      <span>يا حبايب</span>
      <span class="role-badge" id="userNameBadge">عميل</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="conn-dot" title="حالة الاتصال"></span>
    </div>
  </header>

  <main class="screen-pad with-bottom-nav">
    <div class="tabs" id="tabs"></div>
    <div class="menu-grid" id="menuGrid"></div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="left">
      <span class="count-pill" id="cartBarCount">0</span>
      <span data-i18n="cart_view">عرض السلة</span>
    </div>
    <div id="cartBarTotal">0 ر.س</div>
  </div>

  <!-- سلة الطلب -->
  <div class="overlay" id="cartOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 data-i18n="cart_title">سلتك</h2>
      <div id="cartItemsList"></div>

      <div class="field" style="margin-top:14px;">
        <label data-i18n="label_table">رقم الطاولة</label>
        <input type="text" id="tableNumber" placeholder="مثال: 5" maxlength="10" required />
      </div>
      <div class="field">
        <label data-i18n="label_notes">ملاحظات (اختياري)</label>
        <textarea id="orderNotes" placeholder="مثال: بدون بصل" maxlength="200"></textarea>
      </div>

      <div class="total-row">
        <span data-i18n="label_total">الإجمالي</span>
        <span id="cartTotal">0 ر.س</span>
      </div>

      <button class="btn btn-primary btn-block" id="submitOrderBtn" data-i18n="btn_submit_order">إرسال الطلب للمطبخ</button>
      <button class="btn btn-outline btn-block" style="margin-top:8px;" id="closeCartBtn" data-i18n="btn_close">إغلاق</button>
    </div>
  </div>

  <!-- طلباتي -->
  <div class="overlay" id="myOrdersOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 data-i18n="my_orders_title">طلباتي</h2>
      <div id="myOrders"></div>
      <button class="btn btn-outline btn-block" style="margin-top:8px;" id="closeMyOrdersBtn" data-i18n="btn_close">إغلاق</button>
    </div>
  </div>

  <!-- خدمة العملاء -->
  <div class="overlay" id="chatOverlay">
    <div class="sheet chat-sheet">
      <div class="sheet-handle"></div>
      <h2>💬 خدمة العملاء</h2>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-quick-options" id="chatQuickOptions">
        <button class="chat-quick-btn" data-msg="⏰ طلبي متأخر، وين وصل؟">⏰ طلبي متأخر</button>
        <button class="chat-quick-btn" data-msg="❌ وصلني طلب خاطئ">❌ طلب خاطئ</button>
        <button class="chat-quick-btn" data-msg="🍽️ ناقصني صنف من طلبي">🍽️ ناقص صنف</button>
        <button class="chat-quick-btn" data-msg="✏️ أبغى أعدّل طلبي">✏️ تعديل الطلب</button>
        <button class="chat-quick-btn" data-msg="💳 عندي مشكلة بالدفع">💳 مشكلة بالدفع</button>
        <button class="chat-quick-btn" data-msg="ℹ️ عندي استفسار عام">ℹ️ استفسار عام</button>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="اكتب رسالتك..." maxlength="1000" />
        <button class="btn btn-primary" id="chatSendBtn">إرسال</button>
      </div>
    </div>
  </div>

  <!-- شريط التنقّل السفلي -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" id="homeTabBtn">
      <span class="n-icon">🏠</span>
      <span>الرئيسية</span>
    </button>
    <button class="bottom-nav-item" id="cartIconBtn">
      <span class="n-icon">🛒</span>
      <span>السلة</span>
      <span class="badge-count" id="cartCount" style="display:none;">0</span>
    </button>
    <button class="bottom-nav-item" id="myOrdersIconBtn">
      <span class="n-icon">📋</span>
      <span data-i18n="my_orders_title">طلباتي</span>
    </button>
    <button class="bottom-nav-item" id="chatIconBtn">
      <span class="n-icon">💬</span>
      <span>الدعم</span>
      <span class="badge-count" id="chatBadge" style="display:none;">0</span>
    </button>
    <a class="bottom-nav-item" href="/settings.html">
      <span class="n-icon">👤</span>
      <span>الحساب</span>
    </a>
  </nav>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
