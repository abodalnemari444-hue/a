<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>المنيو - مطعم البيت الشامي</title>
  <meta name="theme-color" content="#d9622b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="البيت الشامي" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo-emoji">🍽️</span>
      <span>البيت الشامي</span>
      <span class="role-badge" id="userNameBadge">عميل</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="conn-dot" title="حالة الاتصال"></span>
      <a href="/settings.html" class="icon-btn" title="الإعدادات">⚙️</a>
      <button class="icon-btn" id="logoutBtn" title="تسجيل خروج">🚪</button>
      <button class="icon-btn" id="cartIconBtn">
        🛒
        <span class="badge-count" id="cartCount" style="display:none;">0</span>
      </button>
    </div>
  </header>

  <main class="screen-pad">
    <div class="tabs" id="tabs"></div>
    <div class="menu-grid" id="menuGrid"></div>

    <div class="section-title" id="myOrdersTitle" style="display:none;" data-i18n="my_orders_title">طلباتي</div>
    <div id="myOrders"></div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="left">
      <span class="count-pill" id="cartBarCount">0</span>
      <span data-i18n="cart_view">عرض السلة</span>
    </div>
    <div id="cartBarTotal">0 ر.س</div>
  </div>

  <!-- سلة الطلب -->
  <div class="overlay" id="cartOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 data-i18n="cart_title">سلتك</h2>
      <div id="cartItemsList"></div>

      <div class="field" style="margin-top:14px;">
        <label data-i18n="label_table">رقم الطاولة</label>
        <input type="text" id="tableNumber" placeholder="مثال: 5" maxlength="10" required />
      </div>
      <div class="field">
        <label data-i18n="label_notes">ملاحظات (اختياري)</label>
        <textarea id="orderNotes" placeholder="مثال: بدون بصل" maxlength="200"></textarea>
      </div>

      <div class="total-row">
        <span data-i18n="label_total">الإجمالي</span>
        <span id="cartTotal">0 ر.س</span>
      </div>

      <button class="btn btn-primary btn-block" id="submitOrderBtn" data-i18n="btn_submit_order">إرسال الطلب للمطبخ</button>
      <button class="btn btn-outline btn-block" style="margin-top:8px;" id="closeCartBtn" data-i18n="btn_close">إغلاق</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/menu.js"></script>
</body>
</html>
