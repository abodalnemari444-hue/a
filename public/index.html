<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>تسجيل الدخول - مطعم يا حبايب</title>
  <meta name="description" content="سجّل دخولك لطلب طعامك المفضل" />
  <meta name="theme-color" content="#d9622b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="يا حبايب" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="landing">
    <div class="logo-emoji-big">🍽️</div>
    <h1>مطعم يا حبايب</h1>
    <p class="tagline" data-i18n="app_tagline">نكهة بيتنا... وصلتك أينما كنت</p>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-mode="login" data-i18n="tab_login">تسجيل الدخول</button>
        <button class="auth-tab" data-mode="register" data-i18n="tab_register">إنشاء حساب جديد</button>
      </div>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none;">
          <label data-i18n="label_name">الاسم</label>
          <input type="text" id="fName" placeholder="مثال: أحمد" maxlength="40" autocomplete="name" />
        </div>
        <div class="field">
          <label data-i18n="label_phone">رقم الجوال</label>
          <input type="tel" id="fPhone" placeholder="05xxxxxxxx" autocomplete="tel" required />
        </div>
        <div class="field">
          <label data-i18n="label_password">كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="fPassword" placeholder="••••••" minlength="6" autocomplete="current-password" required />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="إظهار كلمة المرور">👁️</button>
          </div>
        </div>

        <div class="error-box" id="authError" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">دخول</button>
      </form>

      <form id="verifyForm" style="display:none;">
        <p class="verify-hint"><span data-i18n="verify_hint_before">أرسلنا رمز تحقق مكوّن من 6 أرقام إلى جوالك</span> <strong id="verifyPhoneLabel"></strong><span data-i18n="verify_hint_after">، أدخله هنا لتفعيل حسابك.</span></p>
        <div class="field">
          <label data-i18n="label_code">رمز التحقق</label>
          <input type="text" id="fCode" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code" required />
        </div>

        <div class="error-box" id="verifyError" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="verifySubmit" data-i18n="btn_verify">تحقق وتفعيل الحساب</button>
        <button type="button" class="link-btn" id="resendCodeBtn">لم يصلني الرمز؟ إعادة الإرسال</button>
        <button type="button" class="btn btn-outline btn-block" style="margin-top:8px;" id="backToFormBtn" data-i18n="btn_back">رجوع</button>
      </form>

      <div id="viewChoice" style="display:none;">
        <p class="verify-hint">اختر طريقة الدخول لهذه الجلسة</p>
        <button type="button" class="role-card kitchen" id="choiceKitchen" style="margin-bottom:12px;">
          <div class="r-icon">👨‍🍳</div>
          <div class="r-text">
            <h3>الدخول كمطبخ</h3>
            <p>استقبال الطلبات وإدارتها</p>
          </div>
          <div class="r-go">‹</div>
        </button>
        <button type="button" class="role-card customer" id="choiceCustomer">
          <div class="r-icon">🧑‍🍳</div>
          <div class="r-text">
            <h3>الدخول كزبون</h3>
            <p>تصفح المنيو وإرسال طلب</p>
          </div>
          <div class="r-go">‹</div>
        </button>
      </div>
    </div>

    <button class="install-hint">📲 ثبّت التطبيق على جوالك</button>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
