<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>الإعدادات - مطعم يا حبايب</title>
  <meta name="theme-color" content="#d9622b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="يا حبايب" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="icon-btn" id="backBtn" title="رجوع">←</button>
      <span data-i18n="settings_title">الإعدادات</span>
    </div>
    <a href="/menu.html" id="supportLink" class="icon-btn" title="خدمة العملاء">🎧</a>
  </header>

  <main class="screen-pad">
    <div class="section-title">التطبيق</div>
    <div class="settings-list">
      <div class="settings-row">
        <div class="s-icon">🔔</div>
        <div class="s-text">
          <h3 data-i18n="settings_sound_title">صوت التنبيه</h3>
          <p>تشغيل صوت عند وصول طلب جديد (شاشة المطبخ)</p>
        </div>
        <button class="toggle-switch" id="soundToggle" aria-label="صوت التنبيه"></button>
      </div>

      <div class="settings-row">
        <div class="s-icon">🌙</div>
        <div class="s-text">
          <h3 data-i18n="settings_dark_title">الوضع الداكن</h3>
          <p>مظهر داكن مريح للعين</p>
        </div>
        <button class="toggle-switch" id="darkToggle" aria-label="الوضع الداكن"></button>
      </div>

      <div class="settings-row">
        <div class="s-icon">🌐</div>
        <div class="s-text">
          <h3 data-i18n="settings_lang_title">اللغة</h3>
          <p>لغة واجهة التطبيق (ترجمة آلية تقريبية)</p>
        </div>
        <select id="langSelect" class="lang-select"></select>
      </div>
    </div>

    <div class="section-title">الحساب</div>
    <div class="settings-list">
      <a href="/profile.html" class="settings-row">
        <div class="s-icon">👤</div>
        <div class="s-text">
          <h3>الملف الشخصي</h3>
          <p>بياناتك: الاسم ورقم الجوال ونوع الحساب</p>
        </div>
      </a>

      <button class="settings-row" id="logoutRow" style="cursor:pointer; border:none; width:100%; text-align:right; font-family:inherit;">
        <div class="s-icon logout-btn" style="border-radius:12px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </div>
        <div class="s-text">
          <h3>تسجيل خروج</h3>
          <p>الخروج من حسابك الحالي</p>
        </div>
      </button>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
