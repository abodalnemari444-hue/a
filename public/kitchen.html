<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>لوحة المطبخ - مطعم يا حبايب</title>
  <meta name="theme-color" content="#2f6b4f" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="مطبخ يا حبايب" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo-emoji">👨‍🍳</span>
      <span data-i18n="kitchen_title">لوحة المطبخ</span>
      <span class="role-badge" id="userNameBadge">مطبخ</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="conn-dot" title="حالة الاتصال"></span>
      <a href="/settings.html" class="icon-btn" title="الإعدادات">⚙️</a>
      <button class="icon-btn" id="chatIconBtn" title="محادثات العملاء">
        💬
        <span class="badge-count" id="chatBadge" style="display:none;">0</span>
      </button>
      <button class="icon-btn logout-btn" id="logoutBtn" title="تسجيل خروج">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <main class="screen-pad">
    <div class="kanban">
      <div class="kanban-col">
        <h2>🆕 <span data-i18n="col_new">طلبات جديدة</span> <span class="count" id="countPending">0</span></h2>
        <div class="col-list" id="colPending"></div>
      </div>
      <div class="kanban-col">
        <h2>🔥 <span data-i18n="col_preparing">قيد التحضير</span> <span class="count" id="countPreparing">0</span></h2>
        <div class="col-list" id="colPreparing"></div>
      </div>
      <div class="kanban-col">
        <h2>✅ <span data-i18n="col_ready">جاهزة للتسليم</span> <span class="count" id="countReady">0</span></h2>
        <div class="col-list" id="colReady"></div>
      </div>
    </div>
  </main>

  <!-- محادثات خدمة العملاء -->
  <div class="overlay" id="chatOverlay">
    <div class="sheet chat-sheet">
      <div class="sheet-handle"></div>
      <div id="chatListView">
        <h2>💬 محادثات العملاء</h2>
        <div class="chat-thread-list" id="chatThreadList"></div>
      </div>
      <div id="chatThreadView" style="display:none; flex:1; min-height:0; display:flex; flex-direction:column;">
        <div class="chat-thread-header">
          <button class="icon-btn" id="chatBackBtn">→</button>
          <h2 id="chatThreadName"></h2>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="اكتب ردك..." maxlength="1000" />
          <button class="btn btn-primary" id="chatSendBtn">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/kitchen.js"></script>
</body>
</html>
