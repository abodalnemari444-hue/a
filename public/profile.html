<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>الملف الشخصي - مطعم يا حبايب</title>
  <meta name="theme-color" content="#d9622b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="يا حبايب" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="icon-btn" id="backBtn" title="رجوع">←</button>
      <span>الملف الشخصي</span>
    </div>
    <span class="conn-dot" style="display:none;"></span>
  </header>

  <main class="screen-pad">
    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar">👤</div>
      <h2 id="profileName">—</h2>
      <span class="role-badge" id="profileRoleBadge">—</span>
    </div>

    <div class="section-title">البيانات</div>
    <div class="settings-list">
      <div class="settings-row">
        <div class="s-icon">📱</div>
        <div class="s-text">
          <h3>رقم الجوال</h3>
          <p id="profilePhone">—</p>
        </div>
      </div>
      <div class="settings-row">
        <div class="s-icon">🗓️</div>
        <div class="s-text">
          <h3>عضو منذ</h3>
          <p id="profileSince">—</p>
        </div>
      </div>
    </div>

    <div class="section-title">الأمان</div>
    <div class="settings-list">
      <button type="button" class="settings-row" id="changePasswordRow" style="cursor:pointer; border:none; width:100%; text-align:right; font-family:inherit;">
        <div class="s-icon">🔒</div>
        <div class="s-text">
          <h3>تغيير كلمة المرور</h3>
          <p>تحديث كلمة مرور حسابك</p>
        </div>
      </button>
    </div>
  </main>

  <!-- تغيير كلمة المرور -->
  <div class="overlay" id="changePasswordOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2>🔒 تغيير كلمة المرور</h2>
      <form id="changePasswordForm">
        <div class="field">
          <label>كلمة المرور الحالية</label>
          <div class="password-wrap">
            <input type="password" id="currentPassword" placeholder="••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-password" data-target="currentPassword" aria-label="إظهار كلمة المرور">👁️</button>
          </div>
        </div>
        <div class="field">
          <label>كلمة المرور الجديدة</label>
          <div class="password-wrap">
            <input type="password" id="newPassword" placeholder="••••••" minlength="6" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="newPassword" aria-label="إظهار كلمة المرور">👁️</button>
          </div>
        </div>
        <div class="field">
          <label>تأكيد كلمة المرور الجديدة</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="••••••" minlength="6" autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="إظهار كلمة المرور">👁️</button>
          </div>
        </div>

        <div class="error-box" id="passwordError" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-block" id="changePasswordBtn">تحديث كلمة المرور</button>
        <button type="button" class="btn btn-outline btn-block" style="margin-top:8px;" id="closeChangePasswordBtn">إغلاق</button>
      </form>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
