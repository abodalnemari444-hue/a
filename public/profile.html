<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>الملف الشخصي - مطعم يا حبايب</title>
  <meta name="theme-color" content="#d9622b" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="يا حبايب" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <button class="icon-btn" id="backBtn" title="رجوع">←</button>
      <span>الملف الشخصي</span>
    </div>
    <span class="conn-dot" style="display:none;"></span>
  </header>

  <main class="screen-pad">
    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar">👤</div>
      <h2 id="profileName">—</h2>
      <span class="role-badge" id="profileRoleBadge">—</span>
    </div>

    <div class="section-title">البيانات</div>
    <div class="settings-list">
      <div class="settings-row">
        <div class="s-icon">📱</div>
        <div class="s-text">
          <h3>رقم الجوال</h3>
          <p id="profilePhone">—</p>
        </div>
      </div>
      <div class="settings-row">
        <div class="s-icon">🗓️</div>
        <div class="s-text">
          <h3>عضو منذ</h3>
          <p id="profileSince">—</p>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
