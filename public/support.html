<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script>if (localStorage.getItem('shami_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>خدمة العملاء - مطعم يا حبايب</title>
  <meta name="theme-color" content="#2f6b4f" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="دعم يا حبايب" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="chat-embedded">
  <header class="topbar">
    <div class="brand">
      <span class="logo-emoji">💬</span>
      <span>خدمة العملاء</span>
      <span class="role-badge" id="userNameBadge">مشرف</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="conn-dot" title="حالة الاتصال"></span>
      <a href="/kitchen.html" class="icon-btn" title="لوحة الطلبات">🍽️</a>
      <a href="/settings.html" class="icon-btn" title="الإعدادات">⚙️</a>
      <button class="icon-btn logout-btn" id="logoutBtn" title="تسجيل خروج">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <!-- محادثات خدمة العملاء (نفس هيكل لوحة المطبخ، لكن كصفحة قائمة بذاتها) -->
  <div class="overlay" id="chatOverlay">
    <div class="sheet chat-sheet">
      <div id="chatListView">
        <h2>💬 محادثات العملاء</h2>
        <div class="chat-thread-list" id="chatThreadList"></div>
      </div>
      <div id="chatThreadView" style="display:none; flex:1; min-height:0; display:flex; flex-direction:column;">
        <div class="chat-thread-header">
          <button class="icon-btn" id="chatBackBtn">→</button>
          <h2 id="chatThreadName"></h2>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="اكتب ردك..." maxlength="1000" />
          <button class="btn btn-primary" id="chatSendBtn">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <!-- زر مخفي: يستخدمه chat.js لفتح المحادثات تلقائياً بمجرد تحميل الصفحة -->
  <button id="chatIconBtn" style="display:none;">
    <span class="badge-count" id="chatBadge" style="display:none;">0</span>
  </button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/chat.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const res = await fetch('/api/auth/me');
      if (!res.ok) { window.location.href = '/index.html'; return; }
      const data = await res.json();
      document.getElementById('userNameBadge').textContent = data.user.name;
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.href = '/index.html';
      });
      document.getElementById('chatIconBtn').click();
    });
  </script>
</body>
</html>
